name: Build and Publish Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        module: [Server, Model, Camera]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/smartcam-${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-android-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: SmartCam/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: SmartCam
        run: npm ci

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.SMARTCAM_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/smartcam-release.keystore"

      - name: Generate native Android project
        working-directory: SmartCam
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        working-directory: SmartCam/android
        env:
          SMARTCAM_KEYSTORE_PATH: ${{ runner.temp }}/smartcam-release.keystore
          SMARTCAM_KEYSTORE_PASSWORD: ${{ secrets.SMARTCAM_KEYSTORE_PASSWORD }}
          SMARTCAM_KEY_ALIAS: ${{ secrets.SMARTCAM_KEY_ALIAS }}
          SMARTCAM_KEY_PASSWORD: ${{ secrets.SMARTCAM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp SmartCam/android/app/build/outputs/apk/release/app-release.apk SmartCam-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCam-release-apk
          path: SmartCam-release.apk
          retention-days: 30

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: SmartCam Android (Latest)
          body: Automatically built Android release APK from `${{ github.sha }}`.
          prerelease: true
          files: SmartCam-release.apk
